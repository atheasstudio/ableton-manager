[package]
name = "ableton-manager"
version = "0.1.0"
edition = "2021"
description = "Gestionnaire de projets Ableton Live"

[lib]
name = "ableton_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
als-parser = { path = "../crates/als-parser" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
thiserror = "2"
blake3 = "1"
notify = "8"
mp3lame-encoder = "0.2.5"
rosc = "0.11.4"
symphonia = { version = "0.5.4", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aiff", "ogg", "vorbis", "isomp4", "aac"] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3"
